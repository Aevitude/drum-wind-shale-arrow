<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>林迟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f2eee6;
        --ink: #1b1916;
        --mute: #7c776e;
        --line: #d5cfc4;
        --accent: #1b1916;
      }
      .theme-ivory { --paper: #f2eee6; --ink: #1b1916; --mute: #7c776e; --line: #d5cfc4; --accent: #1b1916; }
      .theme-ink { --paper: #121211; --ink: #ece7de; --mute: #8d8880; --line: #2c2b28; --accent: #ece7de; }
      .theme-clay { --paper: #e7dcc8; --ink: #2b2018; --mute: #8a7460; --line: #d0c2ab; --accent: #6a3e28; }
      .theme-moss { --paper: #d7ddd4; --ink: #1a221a; --mute: #687468; --line: #bec6ba; --accent: #2c4736; }
      .theme-sand { --paper: #e8dfd2; --ink: #2a2218; --mute: #877c6a; --line: #d3c8b6; --accent: #855632; }
      .theme-wine { --paper: #281618; --ink: #f0e6d6; --mute: #a88c8c; --line: #3d2428; --accent: #c4a07c; }
      .theme-stone { --paper: #e5e3df; --ink: #222220; --mute: #787672; --line: #ceccc6; --accent: #222220; }
      .theme-night { --paper: #161614; --ink: #e8e0d2; --mute: #8a8478; --line: #2c2c28; --accent: #c6b496; }
      .theme-porcelain { --paper: #eef0f2; --ink: #1b2430; --mute: #6a7480; --line: #d2d6da; --accent: #2a4060; }
      .theme-rust { --paper: #dcc8b4; --ink: #29180f; --mute: #8a6c58; --line: #c8b09a; --accent: #8a3c1e; }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: color-mix(in srgb, var(--paper) 70%, #000 30%);
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
      }
      .sheet {
        max-width: 740px;
        min-height: 100dvh;
        margin: 0 auto;
        background: var(--paper);
        padding: 64px 28px 48px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 48px;
      }
      .house,
      .label,
      .num,
      .foot {
        font-family: Jost, "Noto Sans SC", sans-serif;
        font-weight: 300;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--mute);
      }
      h1 {
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 500;
        font-size: clamp(36px, 8vw, 64px);
        letter-spacing: 0.12em;
        line-height: 1.2;
        white-space: nowrap;
        text-wrap: balance;
      }
      .role {
        margin: 18px 0 0;
        font-size: 14px;
        letter-spacing: 0.18em;
        color: var(--mute);
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 40px 0;
      }
      .statement {
        margin: 0;
        max-width: 34em;
        font-size: 16px;
        line-height: 1.85;
        text-wrap: pretty;
      }
      .label { margin: 0 0 28px; }
      article {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 12px;
        padding: 22px 0;
        border-top: 1px solid var(--line);
      }
      article:last-of-type { border-bottom: 1px solid var(--line); }
      .num { padding-top: 7px; color: var(--accent); }
      article h2 {
        margin: 0;
        font-family: "Noto Serif SC", serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.08em;
      }
      article p {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.75;
        color: var(--mute);
        max-width: 36em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 56px;
        text-transform: none;
        letter-spacing: 0.12em;
      }
      @media (min-width: 720px) {
        .sheet { padding: 88px 72px 64px; }
        .top { margin-bottom: 88px; }
      }
      @media print {
        body { background: var(--paper); }
        .sheet { max-width: none; }
      }
    </style>
  </head>
  <body class="theme-ivory">
    <div class="sheet">
      <div class="top">
        <p class="house">Dossier</p>
        <p class="house"><!--CITY-->上海<!--/CITY--></p>
      </div>

      <h1><!--NAME-->林迟<!--/NAME--></h1>
      <p class="role"><!--ROLE-->空间与物件<!--/ROLE--></p>

      <hr />

      <p class="statement"><!--STATEMENT-->过去十年在上海与京都之间做空间。不扩张团队，一年只接有限的项目，把材料、比例和光一次做对。<!--/STATEMENT--></p>

      <hr />

      <section>
        <p class="label">Selected work</p>
        <article>
          <span class="num">01</span>
          <div>
            <h2><!--W1T-->安福路宅<!--/W1T--></h2>
            <p><!--W1B-->沿街旧宅改成画廊与住所。木结构不动，只改光线。<!--/W1B--></p>
          </div>
        </article>
        <article>
          <span class="num">02</span>
          <div>
            <h2><!--W2T-->铜器店<!--/W2T--></h2>
            <p><!--W2B-->空间与包装一起做。货架是同一块铜板折出来的。<!--/W2B--></p>
          </div>
        </article>
        <article>
          <span class="num">03</span>
          <div>
            <h2><!--W3T-->四席茶室<!--/W3T--></h2>
            <p><!--W3B-->地面比街道低半级。雨天能听见沟里的水。<!--/W3B--></p>
          </div>
        </article>
      </section>

      <div class="foot">
        <span><!--CONTACT-->微信 linchi.studio<!--/CONTACT--></span>
        <span><!--CITY2-->上海<!--/CITY2--></span>
      </div>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var theme = q.get("theme");
        var allowed = {
          ivory: 1, ink: 1, clay: 1, moss: 1, sand: 1,
          wine: 1, stone: 1, night: 1, porcelain: 1, rust: 1,
        };
        if (theme && allowed[theme]) document.body.className = "theme-" + theme;
      })();
    </script>
  </body>
</html>
